name: Bake default map data (Lotte World Tower 5 km)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # 매달 1일 03:17 UTC
  push:
    branches: [main]
    paths: [index.html, tools/bake.mjs]

permissions:
  contents: write

concurrency:
  group: bake
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Bake
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
        run: node tools/bake.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: bake Lotte World Tower 5 km"
          git pull --rebase origin main
          git push
